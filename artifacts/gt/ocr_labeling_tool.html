<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OCR 정답지 교정 도구</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --ink:#1c2733; --sub:#6b7787;
          --draft:#b45309; --draft-bg:#fef3c7; --human:#15803d; --human-bg:#dcfce7;
          --empty:#b91c1c; --empty-bg:#fee2e2; --edit:#1d4ed8; --edit-bg:#dbeafe; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  .tabs button, .filters button, .actions button {
    border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:6px;
    cursor:pointer; font-size:13px; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .filters button.on { background:var(--edit-bg); color:var(--edit); border-color:var(--edit); }
  .actions button.primary { background:var(--edit); color:#fff; border-color:var(--edit); }
  #stats { font-size:12.5px; color:var(--sub); margin-left:auto; }
  main { max-width:1100px; margin:0 auto; padding:14px 16px 80px; }
  .row { display:flex; gap:14px; background:var(--card); border:1px solid var(--line);
         border-radius:10px; padding:12px; margin-bottom:12px; }
  .row.done { border-left:4px solid var(--human); }
  .imgbox { flex:0 0 380px; }
  .imgbox img { max-width:380px; max-height:240px; object-fit:contain; border:1px solid var(--line);
                border-radius:6px; background:#eee; cursor:zoom-in; display:block; }
  .imgbox img.zoom { max-width:none; max-height:none; width:auto; cursor:zoom-out; }
  .meta { font-size:12px; color:var(--sub); margin-top:6px; word-break:break-all; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; }
  .badge.ocr_draft { background:var(--draft-bg); color:var(--draft); }
  .badge.human { background:var(--human-bg); color:var(--human); }
  .badge.empty { background:var(--empty-bg); color:var(--empty); }
  .badge.swapped { background:var(--draft-bg); color:var(--empty); border:1px solid var(--empty); }
  .badge.edited { background:var(--edit-bg); color:var(--edit); }
  .badge.excl { background:var(--empty); color:#fff; }
  .row.excl { border-left:4px solid var(--empty); opacity:0.55; }
  .rowbtns .excl-btn { border-color:var(--empty); color:var(--empty); }
  .txt { flex:1; display:flex; flex-direction:column; gap:6px; }
  textarea { width:100%; min-height:110px; font-size:15px; padding:8px; border:1px solid var(--line);
             border-radius:6px; resize:vertical; font-family:'Malgun Gothic',monospace; line-height:1.5; }
  textarea:focus { outline:2px solid var(--edit); }
  .hint { font-size:12px; color:var(--sub); }
  .rowbtns { display:flex; gap:8px; }
  .rowbtns button { font-size:12px; padding:4px 10px; border:1px solid var(--line); background:#fff;
                    border-radius:5px; cursor:pointer; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
           padding:8px 16px; font-size:12.5px; color:var(--sub); display:flex; gap:16px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>OCR 정답지 교정</h1>
  <span class="tabs" id="tabs"></span>
  <span class="filters" id="filters"></span>
  <span class="actions">
    <button class="primary" onclick="saveCheckpoint()">중간 저장(파일)</button>
    <button onclick="document.getElementById('ckpt').click()">저장 불러오기</button>
    <input type="file" id="ckpt" accept=".json" style="display:none" onchange="loadCheckpoint(this)">
    <button onclick="exportCsv()">CSV 내보내기</button>
    <button onclick="resetRegion()">이 지역 수정 초기화</button>
  </span>
  <span id="stats"></span>
</header>
<main id="list"></main>
<footer>
  <b>사용법</b>
  <span>줄바꿈: 텍스트 안에서 실제 Enter 로 입력 (내보낼 때 자동으로 \n 리터럴로 변환)</span>
  <span>이미지 클릭 = 원본 크기 확대</span>
  <span>"이 이미지 제외" = 정답지·학습·평가에서만 제외 (파일 삭제 아님)</span>
  <span>"안 보이는 글씨(###)" = 읽을 수 없는 작은 글씨 표시 → 채점 제외</span>
  <span><b>중간 저장(파일)을 수시로 누르세요</b> — 자동 저장은 브라우저에만 남아 초기화될 수 있습니다</span>
</footer>

let dirty = false;   // edits since last checkpoint/CSV export
window.addEventListener('beforeunload', ev => {

const LS = (r) => 'ocr_gt_edit_v2__' + r;
function loadEdits(r){ try { return JSON.parse(localStorage.getItem(LS(r))||'{}'); } catch(e){ return {}; } }
function saveEdit(r, name, text){
  const e = loadEdits(r); e[name] = text; localStorage.setItem(LS(r), JSON.stringify(e));
  dirty = true;
}
function delEdit(r, name){
  const e = loadEdits(r); delete e[name]; localStorage.setItem(LS(r), JSON.stringify(e));
  dirty = true;
}
const LSX = (r) => 'ocr_gt_excl_v2__' + r;
function loadExcl(r){ try { return JSON.parse(localStorage.getItem(LSX(r))||'{}'); } catch(e){ return {}; } }
function toggleExcl(name){
  const e = loadExcl(region);
  if (e[name]) delete e[name]; else e[name] = true;
  localStorage.setItem(LSX(region), JSON.stringify(e));

  render();
}

// ---- file checkpoint: survives browser-storage wipes, portable between the
// ---- local tool and the remote page (same JSON shape in both)
function saveCheckpoint(){
  const data = {kind:'ocr_gt_checkpoint', edits:{}, excl:{}};
  for (const r of REGIONS){ data.edits[r] = loadEdits(r); data.excl[r] = loadExcl(r); }
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ocr_gt_checkpoint_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  dirty = false;
}
function loadCheckpoint(inp){
  const f = inp.files && inp.files[0];
  if (!f) return;
  f.text().then(t => {
    let d;
    try { d = JSON.parse(t); } catch(e){ alert('JSON 파싱 실패: 체크포인트 파일이 아닙니다'); return; }
    if (!d || d.kind !== 'ocr_gt_checkpoint'){ alert('체크포인트 파일이 아닙니다'); return; }
    let ne = 0, nx = 0;
    for (const r of REGIONS){
      const e = loadEdits(r), x = loadExcl(r);
      Object.assign(e, (d.edits && d.edits[r]) || {});
      Object.assign(x, (d.excl  && d.excl[r])  || {});
      localStorage.setItem(LS(r), JSON.stringify(e));
      localStorage.setItem(LSX(r), JSON.stringify(x));
      ne += Object.keys((d.edits && d.edits[r]) || {}).length;
      nx += Object.keys((d.excl  && d.excl[r])  || {}).length;
    }
    inp.value = '';
    dirty = false;
    render();
    alert(`불러오기 완료: 수정 ${ne}건 · 제외 ${nx}건 복원`);
  });
}

// draft CSV stores literal backslash-n; editor shows real newlines
const toEditor  = s => (s||'').replace(/\\n/g, '\n');
const toLiteral = s => (s||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().replace(/\n/g,'\\n');

function rows(){
  const edits = loadEdits(region), excl = loadExcl(region);
  return DATA[region].map(r => ({...r, edited: Object.prototype.hasOwnProperty.call(edits, r.image_name),
                                 excluded: !!excl[r.image_name],
                                 cur: Object.prototype.hasOwnProperty.call(edits, r.image_name) ? edits[r.image_name] : toEditor(r.gt_text)}));
}
function visible(r){
  if (filter==='all') return true;
  if (filter==='need') return r.source!=='human';
  if (filter==='empty') return r.source==='empty';
  if (filter==='swapped') return r.source==='swapped';
  if (filter==='edited') return r.edited;
  if (filter==='excl') return r.excluded;
  return true;
}

function render(){
  // tabs
  document.getElementById('tabs').innerHTML = REGIONS.map(r =>
    `<button class="${r===region?'on':''}" onclick="setRegion('${r}')">${r}</button>`).join('');
  const labels = {need:'교정 필요', all:'전체', empty:'empty만', swapped:'재배정 확인', edited:'수정한 것만', excl:'제외한 것만'};
  document.getElementById('filters').innerHTML = Object.entries(labels).map(([k,v]) =>
    `<button class="${k===filter?'on':''}" onclick="setFilter('${k}')">${v}</button>`).join('');

  const all = rows(), shown = all.filter(visible);
  const need = all.filter(r => r.source!=='human');
  const done = need.filter(r => r.edited);
  const nExcl = all.filter(r => r.excluded).length;
  document.getElementById('stats').textContent =
    `${region}: 교정 대상 ${need.length}개 중 ${done.length}개 수정됨 · 제외 ${nExcl}개 · 표시 ${shown.length}행`;

  document.getElementById('list').innerHTML = shown.map(r => `
    <div class="row ${r.excluded?'excl':(r.edited?'done':'')}" id="row_${r.image_name}">
      <div class="imgbox">
        <img src="crop/${region}/${r.image_name}.jpg" loading="lazy"
             onclick="this.classList.toggle('zoom')" alt="${r.image_name}">
        <div class="meta">${r.image_name}
          <span class="badge ${r.source}">${r.source}</span>
          ${r.excluded?'<span class="badge excl">제외됨</span>':(r.edited?'<span class="badge edited">수정됨</span>':'')}
        </div>
      </div>
      <div class="txt">
        <textarea data-name="${r.image_name}" ${r.excluded?'disabled':''}
          oninput="onEdit(this)">${escapeHtml(r.cur)}</textarea>
        <div class="rowbtns">
          <button onclick="revert('${r.image_name}')">원래대로</button>
          <button onclick="clearText('${r.image_name}')">텍스트 없음(빈칸)</button>
          <button onclick="addDontcare('${r.image_name}')" title="사람 눈에도 안 보이는 작은 글씨가 있으면 ### 줄 추가 — 채점 제외">안 보이는 글씨(###)</button>
          <button class="excl-btn" onclick="toggleExcl('${r.image_name}')">${r.excluded?'제외 취소':'이 이미지 제외'}</button>
        </div>
        <div class="hint">${r.excluded?'제외됨 — 정답지·학습·평가에서만 빠지고 이미지 파일은 그대로 남습니다':'여러 줄이면 그대로 Enter 로 줄 나눠 입력'}</div>
      </div>
    </div>`).join('') || '<p style="color:#6b7787">표시할 행이 없습니다.</p>';
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function onEdit(ta){ saveEdit(region, ta.dataset.name, ta.value); refreshStatsOnly(ta.dataset.name); }
function refreshStatsOnly(name){
  const all = rows();
  const need = all.filter(r => r.source!=='human');
  const done = need.filter(r => r.edited);
  document.getElementById('stats').textContent =
    `${region}: 교정 대상 ${need.length}개 중 ${done.length}개 수정됨`;
  const el = document.getElementById('row_'+name);
  if (el) { el.classList.add('done'); }
}
function revert(name){
  delEdit(region, name);
  render();
}
function clearText(name){
  saveEdit(region, name, '');
  render();
}
function addDontcare(name){
  const r = rows().find(x => x.image_name === name);
  const cur = (r ? r.cur : '').replace(/\s+$/, '');
  if (/(^|\n)###$/.test(cur)) return;                 // already ends with a ### line
  saveEdit(region, name, cur ? cur + '\n###' : '###');
  render();
}
function setRegion(r){ region=r; render(); window.scrollTo(0,0); }
function setFilter(f){ filter=f; render(); window.scrollTo(0,0); }
function resetRegion(){
  if (confirm(region+' 지역의 수정·제외 내용을 모두 지울까요? (초안으로 되돌림)')){
    localStorage.removeItem(LS(region)); localStorage.removeItem(LSX(region)); render();
  }
}

function csvField(s){ return '"' + (s||'').replace(/"/g,'""') + '"'; }
function exportCsv(){
  const all = rows();
  let out = '\uFEFFimage_name,gt_text,source\r\n';
  for (const r of all){
    const text = toLiteral(r.cur);
    // excluded wins; otherwise edited rows (or already-human rows) count as human
    const src = r.excluded ? 'excluded' : (r.edited ? 'human' : r.source);
    out += csvField(r.image_name) + ',' + csvField(text) + ',' + csvField(src) + '\r\n';
  }
  const blob = new Blob([out], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ocr_' + region + '_gt_draft_edited.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  dirty = false;
}
render();
</script>
</body>
